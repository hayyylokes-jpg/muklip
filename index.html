
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toko HP Muklip</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>
            <marquee>SELAMAT DATANG DI TOKO HP MUKLIP</marquee>
        </h1>

        <div id="product-list">

            <center>
                <h2>DAFTAR PRODUK</h2>
            </center>

            <div id="product" class="product-container"></div>

        </div>

        <div id="cart">

            <h2>Keranjang Belanja</h2>

            <ul id="cart-items"></ul>

            <p>
                Total: Rp <span id="total-price">0</span>
            </p>

            <button id="checkout-btn">CHECKOUT</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
